version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    environment:
      - RIME_API_KEY=${RIME_API_KEY:-}
      - RIME_MODEL=${RIME_MODEL:-mist}
      - RIME_SPEAKER=${RIME_SPEAKER:-amber}
      - RIME_LANGUAGE=${RIME_LANGUAGE:-en}
      - RIME_ENDPOINT=${RIME_ENDPOINT:-https://users.rime.ai/v1/rime-tts}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sentinel_db
      - TOOL_DELAY_MS=${TOOL_DELAY_MS:-3500}
      - INTERRUPTION_THRESHOLD=${INTERRUPTION_THRESHOLD:-0.65}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/voice
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sentinel_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
